<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DateNight Agent — taste, planned</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 90px; font-size: 1rem; }
  button { font-size: 1rem; padding: .6rem 1.2rem; margin-top: .5rem; cursor: pointer; }
  #out { white-space: pre-wrap; background: #f6f6f6; padding: 1rem; margin-top: 1rem; border-radius: 8px; }
  .badge { display:inline-block; background:#eee; border-radius:4px; padding:.1rem .5rem; font-size:.8rem; }
</style>
</head>
<body>
<h1>DateNight Agent <span class="badge" id="mode"></span></h1>
<p>Describe the person and the evening. The agent reads their taste from Qloo's
taste graph and plans dinner, a film, and a stroll around it.</p>
<textarea id="brief" placeholder="e.g. Plan a date night for someone who loves Wes Anderson films and Taylor Swift, in Chicago"></textarea><br>
<button onclick="plan()">Plan it</button>
<div id="out"></div>
<script>
fetch('/api/health').then(r=>r.json()).then(h=>{
  document.getElementById('mode').textContent = h.mock ? 'demo mode (no API key)' : 'live Qloo mode';
});
async function plan(){
  const brief = document.getElementById('brief').value;
  const out = document.getElementById('out');
  out.textContent = 'Agent is thinking…';
  const r = await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brief})});
  const d = await r.json();
  if(d.error){ out.textContent = 'Error: '+d.error; return; }
  out.textContent = d.itinerary + '\n\n— taste fingerprint: ' +
    d.fingerprint.map(e=>e.name).join(', ');
}
</script>
</body>
</html>
